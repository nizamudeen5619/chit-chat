version: '3.8'

services:
  chit-chat:
    image: berserker619/main-api:latest
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - mongo
    restart: always

  mongo:
    image: mongo:6
    volumes:
      - mongo-data:/data/db
    restart: always

volumes:
  mongo-data: